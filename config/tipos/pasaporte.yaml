nombre: pasaporte
nombre_visible: Pasaporte
categoria: identificacion
descripcion: Pasaporte vigente, pagina de datos personales con zona MRZ.
caracteristicas_esperadas:
  - Fotografia del titular
  - Zona de lectura mecanica (MRZ) de dos lineas al pie
  - Fechas de expedicion y vencimiento
formatos_permitidos: [pdf, jpg, jpeg, png]
ejemplos_referencia: [fixtures/generados/pasaporte_sano_digital.pdf, fixtures/generados/pasaporte_sano_foto.jpg]
campos:
  nombre_completo:    {tipo: texto, obligatorio: true}
  numero_pasaporte:   {tipo: texto, obligatorio: true, patron: "^[A-Z0-9]{8,9}$", sensible: true}
  fecha_nacimiento:   {tipo: fecha, obligatorio: true}
  fecha_expedicion:   {tipo: fecha, obligatorio: false}
  fecha_vencimiento:  {tipo: fecha, obligatorio: true}
  nacionalidad:       {tipo: texto, obligatorio: false}
  sexo:               {tipo: texto, obligatorio: false}
# ADR-007: marcadores verificables en el texto (mayusculas, sin acentos, linea a linea);
# confianza de clasificacion = proporcion encontrada. Cuantos: el umbral tolera uno sin encontrar.
marcadores_clasificacion:
  - '\bPASAPORTE\b|\bPASSPORT\b'
  - '(^|\s)P<[A-Z0-9<]{3}'
  - '[A-Z0-9<]{9}[0-9O][A-Z0-9<]{3}[0-9O]{6}'
  - 'NUMERO\s*(DE\s*)?PASAPORTE|PASSPORT\s*NO'
  - 'FECHA\s*(DE\s*)?EXPEDICION|DATE\s*OF\s*ISSUE'
  - 'FECHA\s*(DE\s*)?VENCIMIENTO|CADUCIDAD|DATE\s*OF\s*EXPIRY'
  - 'NACIONALIDAD|NATIONALITY'
confianza_minima_clasificacion: 0.85
confianza_minima_campo: 0.80
reglas:
  - id: vigencia_documento
    tipo: fecha_posterior_a_hoy
    campo: fecha_vencimiento
    severidad: bloqueante
    mensaje: El pasaporte esta vencido
  - id: vigencia_proxima
    tipo: fecha_posterior_a_hoy_mas_dias
    campo: fecha_vencimiento
    dias: 90
    severidad: preventiva
    mensaje: El pasaporte vence en menos de 90 dias
  - id: formato_numero
    tipo: patron
    campo: numero_pasaporte
    severidad: critica
    mensaje: El numero de pasaporte no tiene un formato valido
  # Coherencia (etapa 2): nacimiento < expedicion < vencimiento (la tercera cubre la expedicion vacia)
  - id: nacimiento_antes_de_expedicion
    tipo: fecha_anterior_a_campo
    campo: fecha_nacimiento
    campo_relacionado: fecha_expedicion
    severidad: critica
    mensaje: La fecha de nacimiento no es anterior a la de expedicion
  - id: expedicion_antes_de_vencimiento
    tipo: fecha_anterior_a_campo
    campo: fecha_expedicion
    campo_relacionado: fecha_vencimiento
    severidad: critica
    mensaje: La fecha de expedicion no es anterior a la de vencimiento
  - id: nacimiento_antes_de_vencimiento
    tipo: fecha_anterior_a_campo
    campo: fecha_nacimiento
    campo_relacionado: fecha_vencimiento
    severidad: critica
    mensaje: La fecha de nacimiento no es anterior a la de vencimiento
comparaciones:
  credencial_elector: [nombre_completo, fecha_nacimiento]
