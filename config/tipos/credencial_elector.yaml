nombre: credencial_elector
nombre_visible: Credencial de elector
categoria: identificacion
descripcion: Credencial para votar vigente, anverso (y reverso opcional).
caracteristicas_esperadas:
  - Fotografia del titular
  - Clave de elector y CURP
  - Domicilio y vigencia (anio)
formatos_permitidos: [pdf, jpg, jpeg, png]
ejemplos_referencia: [fixtures/generados/credencial_elector_sano_foto.jpg]
campos:
  nombre_completo:  {tipo: texto, obligatorio: true}
  curp:             {tipo: texto, obligatorio: true, patron: "^[A-Z]{4}[0-9]{6}[HM][A-Z]{5}[A-Z0-9][0-9]$", sensible: true}
  clave_elector:    {tipo: texto, obligatorio: false, sensible: true}
  fecha_nacimiento: {tipo: fecha, obligatorio: true}
  domicilio:        {tipo: texto, obligatorio: true}
  vigencia:         {tipo: anio, obligatorio: true}
# ADR-007: marcadores verificables en el texto (mayusculas, sin acentos, linea a linea);
# confianza de clasificacion = proporcion encontrada. Cuantos: el umbral tolera uno sin encontrar.
marcadores_clasificacion:
  - 'CREDENCIAL\s*(DE|PARA)\s*(ELECTOR|VOTAR)'
  - '\bCURP\b'
  - '[A-Z]{4}[0-9]{6}[HM][A-Z]{5}[A-Z0-9][0-9]'
  - 'CLAVE\s*(DE\s*)?ELECTOR'
  - '\bVIGENCIA\b'
  - '\bDOMICILIO\b'
  - 'FECHA\s*(DE\s*)?NACIMIENTO'
confianza_minima_clasificacion: 0.85
confianza_minima_campo: 0.80
reglas:
  - id: vigencia_documento
    tipo: anio_mayor_o_igual_actual
    campo: vigencia
    severidad: bloqueante
    mensaje: La credencial esta vencida
  - id: formato_curp_valido
    tipo: patron
    campo: curp
    severidad: critica
    mensaje: La CURP no tiene un formato valido
  # Coherencia (etapa 2): posiciones 5-10 de la CURP = fecha de nacimiento (AAMMDD; posicion 17: digito antes de 2000)
  - id: curp_coincide_nacimiento
    tipo: curp_coincide_con_fecha
    campo: curp
    campo_relacionado: fecha_nacimiento
    severidad: critica
    mensaje: La CURP no coincide con la fecha de nacimiento
comparaciones:
  pasaporte: [nombre_completo, fecha_nacimiento]
  comprobante_domicilio: [domicilio]
