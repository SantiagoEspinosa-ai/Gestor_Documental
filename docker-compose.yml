services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor
      POSTGRES_DB: gestor
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor"]
      interval: 5s
      retries: 10

  # Opcional: docker compose --profile ollama up. Sin el perfil se usa un Ollama del equipo
  # (choca en el puerto 11434 si ya hay uno instalado).
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # Con GPU NVIDIA descomentar:
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}

  backend:
    build: ./backend
    env_file: .env
    environment:
      CONFIG_DIR: /config
      PROMPTS_DIR: /prompts
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./backend:/app
      - ./config:/config
      - ./prompts:/prompts
    # exec: uvicorn recibe SIGTERM y para limpio (sin exec la recibe sh, que no la reenvia, y docker stop lo mata).
    # --reload-dir app: vigilar solo el codigo. Vigilando todo /app (con backend/.venv del equipo montado) cada
    # pasada tardaba segundos y docker stop acababa en 137. --reload solo para desarrollo; la demo lo quita
    # con docker-compose.demo.yml
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host

volumes:
  pgdata:
  ollama:
