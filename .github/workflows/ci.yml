# Integracion continua: backend (pytest) y frontend (lint, build, Vitest y e2e de mocks) en cada PR a main.
# Sin secretos: S3 va con moto, el motor con el stub (MOTOR_ANALISIS=stub) y el frontend con los mocks de msw.
# Todas las credenciales de este fichero son ficticias. Los e2e reales (e2e-real/) se ejecutan a mano.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor
          POSTGRES_DB: gestor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor -d gestor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores ficticios para que Settings arranque; los tests fijan los suyos
      APP_ENV: dev
      MOTOR_ANALISIS: stub
      SECRET_KEY: clave-ficticia-de-ci
      DATABASE_URL: sqlite://
      AWS_ACCESS_KEY_ID: clave-ficticia-de-ci
      AWS_SECRET_ACCESS_KEY: clave-ficticia-de-ci
      AWS_REGION: us-east-1
      S3_BUCKET: bucket-de-ci
      WEBHOOK_SECRET_HMAC: clave-ficticia-de-ci
      # Los 2 tests de concurrencia (test_folios, test_revision_decision) solo corren contra PostgreSQL
      TEST_POSTGRES_URL: postgresql+psycopg://gestor:gestor@localhost:5432/gestor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Tesseract (para que el test de OCR no se salte)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Dependencias
        run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build (incluye la comprobacion de que no queda ningun mock)
        run: npm run build
      - name: Vitest
        run: npm test
      - name: Playwright (solo Chromium)
        run: npx playwright install --with-deps chromium
      - name: e2e sobre los mocks
        run: npm run test:e2e
